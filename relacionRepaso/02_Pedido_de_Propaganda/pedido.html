<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Pedido electoral</title>
</head>

<body>
    <h1>Pedido de material de campaña (simulación)</h1>
    <form method="post" action="procesarPedido.php">
        <label for="partido">Partido:</label>
        <select id="partido" name="partido" required>
            <option value="PSOE">PSOE</option>
            <option value="PP">PP</option>
            <option value="Vox">Vox</option>
            <option value="Sumar">Sumar</option>
            <option value="Podemos">Podemos</option>
        </select>

        <!-- TODO: radios obligatorios name="pack": basico, movil, completo -->
        <p>Pack:</p>
        <input type="radio" id="basico" name="pack" value="basico" required />
        <label for="basico">Básico</label>

        <input type="radio" id="movil" name="pack" value="movil" />
        <label for="movil">Móvil</label>

        <input type="radio" id="completo" name="pack" value="completo" />
        <label for="completo">Completo</label>

        <!-- TODO: número entero name="unidades", mínimo 1 y máximo 8 -->
        <p>
            <label for="unidades">Unidades:</label>
            <input type="number" id="unidades" name="unidades" min="1" max="8" required />
        </p>

        <!-- TODO: checkboxes name="extras[]": chapas, pegatinas, lanyards, folletos -->
        <p>Extras:</p>
        <input type="checkbox" id="chapas" name="extras[]" value="chapas" />
        <label for="chapas">Chapas</label>

        <input type="checkbox" id="pegatinas" name="extras[]" value="pegatinas" />
        <label for="pegatinas">Pegatinas</label>

        <input type="checkbox" id="lanyards" name="extras[]" value="lanyards" />
        <label for="lanyards">Lanyards</label>

        <input type="checkbox" id="folletos" name="extras[]" value="folletos" />
        <label for="folletos">Folletos</label>

        <!-- TODO: radios obligatorios name="transporte": recogida, normal, urgente -->
        <p>Transporte:</p>
        <input type="radio" id="recogida" name="transporte" value="recogida" required />
        <label for="recogida">Recogida</label>

        <input type="radio" id="normal" name="transporte" value="normal" />
        <label for="normal">Normal</label>

        <input type="radio" id="urgente" name="transporte" value="urgente" />
        <label for="urgente">Urgente</label>

        <!-- TODO: campo de texto opcional name="codigo" (LOCAL2026 o VOLUNTARIADO) -->
        <p>
            <label for="codigo">Código de descuento:</label>
            <input type="text" id="codigo" name="codigo" />
        </p>

        <button type="submit">Calcular pedido</button>
    </form>
</body>

</html>
